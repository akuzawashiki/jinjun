<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>新潟スタンプラリー</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 背景用タグ -->
    <div class="background">
      <img src="../assets/image/FigJam basics (1).png" alt="背景画像" />
    </div>
    <div class="container">
      <div class="top-bar">
        <a href="../1_main_menu/index.html"
          ><img src="../assets/image/logo.png" alt="新潟ロゴ" class="logo"
        /></a>
        <button
          title="アブーチメントってやつ"
          onclick="location.href='../3_badge_list/index.html'"
          class="badge-btn"
        >
          バッジ
        </button>
      </div>

      <div class="menu">
        <button
          title="制覇すると特典クーポン発行！！"
          onclick="location.href='../2_stamp_rally/index.html'"
        >
          スタンプラリー
        </button>
        <button
          title="スタンプラリー達成で抽選参加権や商品券、限定アイテムプレゼント"
          onclick="location.href='../3_stamp_list/index.html'"
        >
          集めたスタンプ
        </button>
        <button
          title="今が熱い！！！旬のおすすめスポット"
          onclick="location.href='../4_rally_spot/index.html'"
        >
          スタンプラリースポット
        </button>
        <button
          title="最新のユーザーレビューを表示！！"
          onclick="location.href='../7_SNS/index.html'"
        >
          SNS
        </button>
        <button
          title="集めたスタンプで新潟の良いもの、と交換しよう！！"
          onclick="location.href='../8_keihinn_list/index.html'"
        >
          景品一覧
        </button>
      </div>
    </div>
    <div
      class="chat-button"
      title="チャットボットと会話！！！"
      onclick="location.href='../10_chat/index.html'"
    >
      💬
    </div>
  </body>
</html>
